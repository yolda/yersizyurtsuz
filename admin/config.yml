backend:
  name: git-gateway
  branch: main
  identity_url: "https://yorum.netlify.app/.netlify/identity"
  gateway_url: "https://yorum.netlify.app/.netlify/git"

locale: tr
media_folder: "medya"
public_folder: "/medya"

collections:
  - name: "yazilar"
    label: "Yazılar"
    label_singular: "Yazı"
    folder: "yazilar"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Listede Görünecek Ad (Dosya)", name: "dosya", widget: "string" }
      - { label: "Yazar", name: "yazar", widget: "string", required: false }
      - { label: "Tarih (GG/AA/YYYY)", name: "tarih", widget: "string", hint: "Örn: 21/11/2026" }
      - { label: "Yazının Ana Başlığı", name: "baslik", widget: "string" }
      - { label: "Metin", name: "metin", widget: "text", hint: "Alt başlık için ## kullanabilirsin. Kalın için **metin**, italik için *metin* yaz." }

  - name: "ayarlar"
    label: "Site Ayarları"
    files:
      - name: "haftanin_filmi"
        label: "Haftanın Filmi"
        file: "ayarlar/film.json"
        fields:
          - { label: "Ekranda Görünecek Metin", name: "ad", widget: "string", default: "haftanın filmi" }
          - { label: "Letterboxd Linki", name: "link", widget: "string" }
