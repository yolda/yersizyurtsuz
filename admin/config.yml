backend:
  name: git-gateway
  branch: main
  identity_url: "https://yorum.netlify.app/.netlify/identity"
  gateway_url: "https://yorum.netlify.app/.netlify/git"

locale: tr
media_folder: "medya"
public_folder: "/medya"

collections:
  - name: "yazilar"
    label: "Yazılar"
    label_singular: "Yazı"
    folder: "yazilar"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    editor:
      preview: false
    fields:
      - { label: "Listede Görünecek Ad (Dosya)", name: "dosya", widget: "string" }
      - { label: "Yazar", name: "yazar", widget: "string", required: false }
      - { label: "Tarih (GG/AA/YYYY)", name: "tarih", widget: "string", hint: "Örn: 21/11/2026" }
      - { label: "Yazının Ana Başlığı", name: "baslik", widget: "string" }
      - label: "Metin"
        name: "metin"
        widget: "text"
        hint: "Biçimlendirme: Kalın yazı için metnin başına sonuna iki yıldız koy, yamuk yapmak için tek yıldız (*), alt başlık yapmak için satır başına ## koy ."

  - name: "ayarlar"
    label: "Site Ayarları"
    files:
      - name: "haftanin_filmi"
        label: "Haftanın Filmi"
        file: "ayarlar/film.json"
        editor:
          preview: false
        fields:
          - { label: "Letterboxd Linki", name: "link", widget: "string", hint: "Örn: https://letterboxd.com/film/dogville/" }
