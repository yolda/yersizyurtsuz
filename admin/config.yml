site_url: "https://yorum.me"
display_url: "https://yorum.me"
publish_mode: editorial_workflow

backend:
  name: git-gateway
  branch: main
  identity_url: "https://yorum.me/.netlify/identity"
  gateway_url: "https://yorum.me/.netlify/git"

locale: tr
media_folder: "medya"
public_folder: "/medya"

collections:
  - name: "yazilar"
    label: "Yazılar"
    label_singular: "Yazı"
    folder: "yazilar"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    editor:
      preview: false
    fields:
      - { label: "Yazının Ana Başlığı", name: "baslik", widget: "string" }
      - { label: "Yazar", name: "yazar", widget: "string", required: false }
      - { label: "Tarih (GG/AA/YYYY)", name: "tarih", widget: "string", hint: "Örn: 21/11/2026" }
      - label: "Metin"
        name: "metin"
        widget: "text"
        hint: "Biçimlendirme: Kalın yazı için metnin başına sonuna iki yıldız koy, yamuk yapmak için tek yıldız (*), alt başlık yapmak için satır başına ## koy ."

  - name: "ayarlar"
    label: "Site Ayarları"
    delete: false
    files:
      - name: "haftanin_filmi"
        label: "Haftanın Filmi"
        file: "ayarlar/film.json"
        editor:
          preview: false
        fields:
          - label: "Letterboxd Linki"
            name: "link"
            widget: "string"
            hint: "Örn: https://letterboxd.com/film/dogville/"
            pattern: ['^https?:\/\/(www\.)?(letterboxd\.com\/film\/[a-zA-Z0-9_-]+\/?|boxd\.it\/[a-zA-Z0-9]+)$', "Lütfen geçerli bir Letterboxd film linki girin (Örn: https://letterboxd.com/film/dogville/)"]
