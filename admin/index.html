<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>yorum — editör</title>
  <script>
    localStorage.setItem("netlifySiteURL", "https://yorum.me");
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* HEM ADMIN HEM YAZAR İÇİN: İş Akışı ekranında 'Taslaklar' ve 'İncelemede' sütunlarını tamamen yok et */
    div[class*="WorkflowList"] > div:nth-child(1),
    div[class*="WorkflowList"] > div:nth-child(2) {
      display: none !important;
    }

    /* Onay kuyruğundaki tek sütunu tam genişliğe yay ve başlığını sadeleştir */
    div[class*="WorkflowList"] > div:nth-child(3) {
      width: 100% !important;
      max-width: 760px !important;
      margin: 0 auto !important;
    }

    /* YAZAR ROLÜ KESİN KISITLAMALARI */
    body.role-yazar a[href*="/collections/ayarlar"],
    body.role-yazar a[href*="workflow"],
    body.role-yazar a[href*="media"],
    body.role-yazar button[class*="PublishButton"],
    body.role-yazar div[class*="PublishControl"],
    body.role-yazar button[class*="DeleteButton"],
    body.role-yazar [data-yazar-gizle="1"] {
      display: none !important;
    }

    /* Yazar mevcut yazıları açıp düzenleyemesin veya silemesin */
    body.role-yazar a[href*="/collections/yazilar/entries/"] {
      pointer-events: none !important;
      opacity: 0.45;
      cursor: default !important;
    }

    /* Yazar kaydederken arka planda otomatik tetiklenen durum menüsünün ekranda yanıp sönmesini engelle */
    body.role-yazar ul[class*="DropdownList"],
    body.role-yazar div[class*="DropdownList"] {
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      function setRole(user) {
        const roles = (user && user.app_metadata && user.app_metadata.roles) || [];
        const isAdmin = roles.includes("admin");
        document.body.classList.toggle("role-admin", isAdmin);
        document.body.classList.toggle("role-yazar", !isAdmin);
      }

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", setRole);
        window.netlifyIdentity.on("login", setRole);
        window.netlifyIdentity.on("logout", function () {
          document.body.classList.remove("role-admin", "role-yazar");
        });
        window.netlifyIdentity.init({
          APIUrl: "https://yorum.me/.netlify/identity"
        });
      }

      // Yazar için üst menüdeki Medya/Images, İş Akışı ve editördeki Durum/Yayınla/Sil öğelerini kesin olarak gizle
      function lockYazarUI() {
        if (!document.body.classList.contains("role-yazar")) return;

        // 1. Üst menüdeki (header) 'İçerikler' (Contents) dışındaki tüm sekmeleri gizle (Medya, İş Akışı vb.)
        document.querySelectorAll("header a, header button, nav a, nav button").forEach(function (el) {
          const text = (el.textContent || "").trim().toLowerCase();
          if (
            text.includes("medya") ||
            text.includes("media") ||
            text.includes("image") ||
            text.includes("iş akışı") ||
            text.includes("workflow")
          ) {
            el.setAttribute("data-yazar-gizle", "1");
          }
        });

        // 2. Editördeki Durum, Yayınla ve Sil kontrollerini gizle
        document.querySelectorAll("button, span, div[role='button']").forEach(function (el) {
          const text = (el.textContent || "").trim().toLowerCase();
          if (
            text === "durum" ||
            text === "status" ||
            text === "taslak" ||
            text === "draft" ||
            text === "incelemede" ||
            text === "in review" ||
            text === "hazır" ||
            text === "ready" ||
            text === "yayınla" ||
            text === "publish" ||
            text === "sil" ||
            text === "delete" ||
            text === "yazıyı sil"
          ) {
            const target = el.closest("button") || el.closest("div[class*='Dropdown']") || el.parentElement;
            if (target) target.setAttribute("data-yazar-gizle", "1");
          }
        });
      }

      new MutationObserver(lockYazarUI).observe(document.body, { childList: true, subtree: true });

      // Yazar 'Kaydet' dediğinde yazıyı arka planda otomatik olarak doğrudan onay kuyruğuna ('Hazır') geçir
      function pushToApprovalQueue() {
        if (!document.body.classList.contains("role-yazar")) return;

        const statusBtn = Array.from(document.querySelectorAll("button, span, div")).find(function (el) {
          const t = (el.textContent || "").trim().toLowerCase();
          return el.children.length === 0 && (t === "taslak" || t === "draft" || t === "durum" || t === "status");
        });

        if (statusBtn) {
          const clickable = statusBtn.closest("button") || statusBtn;
          clickable.click();
          setTimeout(function () {
            const readyItem = Array.from(document.querySelectorAll("li, button, span, div")).find(function (el) {
              const t = (el.textContent || "").trim().toLowerCase();
              return el.children.length === 0 && (t === "hazır" || t === "ready");
            });
            if (readyItem) readyItem.click();
          }, 200);
        }
      }

      document.addEventListener("click", function (e) {
        if (!document.body.classList.contains("role-yazar")) return;
        const btn = e.target.closest("button");
        if (!btn) return;
        const label = (btn.textContent || "").trim().toLowerCase();
        if (label === "kaydet" || label === "save") {
          setTimeout(pushToApprovalQueue, 1200);
          setTimeout(pushToApprovalQueue, 2500);
        }
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.3.3/dist/decap-cms.js"></script>
</body>
</html>
