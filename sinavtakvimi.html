<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinema - Sınav Takvimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <div class="min-h-screen flex flex-col items-center justify-center p-6">
        
        <!-- Üst Başlık ve Geri Dönüş -->
        <div class="w-full max-w-xl mb-8 flex justify-between items-center">
            <a href="index.html" class="text-sm font-medium text-indigo-400 hover:text-indigo-300 transition-colors flex items-center gap-2">
                ← Ana Menüye Dön
            </a>
            <span class="text-xs uppercase tracking-widest text-zinc-500">Akademik Takvim</span>
        </div>

        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-6xl font-black tracking-widest text-white uppercase mb-3 drop-shadow-[0_0_35px_rgba(99,102,241,0.5)]">
                SINAV TAKVİMİ
            </h1>
            <p class="text-zinc-400 text-sm tracking-wider uppercase">Vize Dönemi Sınav Programı</p>
        </div>

        <!-- Sınav Listesi Alanı -->
        <div class="w-full max-w-xl space-y-4">
            
            <!-- Temel Sanat Eğitimi -->
            <div class="p-5 bg-zinc-950/80 backdrop-blur-md border border-zinc-800 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition-all hover:border-indigo-500/50">
                <span class="text-lg font-semibold text-white tracking-wide">Temel Sanat Eğitimi</span>
                <span class="px-4 py-1.5 bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 text-sm font-medium rounded-xl">
                    02/11 - 13.00
                </span>
            </div>

            <!-- Gönüllülük Çalışmaları -->
            <div class="p-5 bg-zinc-950/80 backdrop-blur-md border border-zinc-800 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition-all hover:border-indigo-500/50">
                <span class="text-lg font-semibold text-white tracking-wide">Gönüllülük Çalışmaları</span>
                <span class="px-4 py-1.5 bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 text-sm font-medium rounded-xl">
                    03/11 - 12.00
                </span>
            </div>

            <!-- Medya ve İletişim -->
            <div class="p-5 bg-zinc-950/80 backdrop-blur-md border border-zinc-800 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition-all hover:border-indigo-500/50">
                <span class="text-lg font-semibold text-white tracking-wide">Medya ve İletişim</span>
                <span class="px-4 py-1.5 bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 text-sm font-medium rounded-xl">
                    04/11 - 10.00
                </span>
            </div>

            <!-- Film ve Televizyona Giriş -->
            <div class="p-5 bg-zinc-950/80 backdrop-blur-md border border-zinc-800 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition-all hover:border-indigo-500/50">
                <span class="text-lg font-semibold text-white tracking-wide">Film ve Televizyona Giriş</span>
                <span class="px-4 py-1.5 bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 text-sm font-medium rounded-xl">
                    04/11 - 13.00
                </span>
            </div>

        </div>

        <footer class="mt-16 text-center text-xs text-zinc-600 tracking-wider">
            Radyo, Televizyon ve Sinema Bölümü
        </footer>
    </div>

</body>
</html>
